<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Inscripciones - Sistema de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left me-1"></i>Regresar al Inicio
        </a>
    </div>

    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark"><i class="bi bi-journal-check text-primary me-2"></i>Inscripciones Registradas</h2>
            <p class="text-muted mb-0">Listado de asignaciones de participantes a los distintos cursos.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a href="/inscripciones/nuevo" class="btn btn-primary fw-semibold px-4 shadow-sm">
                <i class="bi bi-plus-circle-fill me-1"></i>Nueva Inscripción
            </a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger shadow-sm border-0 rounded-3" th:text="${error}"></div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="py-3 ps-3">ID</th>
                        <th class="py-3">Curso</th>
                        <th class="py-3">Participante</th>
                        <th class="py-3">Fecha Inscripción</th>
                        <th class="py-3">Estado</th>
                        <th class="py-3 text-end pe-3">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inscripcion : ${inscripciones}">
                        <td class="ps-3 fw-bold" th:text="${inscripcion.id}">1</td>
                        <td>
                            <span class="badge bg-info text-dark px-2 py-1">
                                <i class="bi bi-book me-1"></i>
                                <span th:text="${inscripcion.curso != null ? inscripcion.curso.nombre : 'Curso #' + inscripcion.cursoId}">Curso</span>
                            </span>
                        </td>
                        <td>
                            <span class="fw-semibold text-dark">
                                <i class="bi bi-person-fill text-secondary me-1"></i>
                                <span th:text="${inscripcion.participante != null ? inscripcion.participante.nombres + ' ' + inscripcion.participante.apellidos : 'Participante #' + inscripcion.participanteId}">Participante</span>
                            </span>
                        </td>
                        <td th:text="${inscripcion.fechaInscripcion}">2026-10-20</td>
                        <td>
                            <span th:if="${inscripcion.estado == 'ACTIVA'}" class="badge bg-success px-2 py-1">Activa</span>
                            <span th:unless="${inscripcion.estado == 'ACTIVA'}" class="badge bg-secondary px-2 py-1" th:text="${inscripcion.estado != null ? inscripcion.estado : 'ACTIVA'}">Activa</span>
                        </td>
                        <td class="text-end pe-3">
                            <a th:href="@{/inscripciones/editar/{id}(id=${inscripcion.id})}"
                               class="btn btn-warning btn-sm fw-semibold shadow-sm px-2 me-1">
                                <i class="bi bi-pencil-square me-1"></i>Editar
                            </a>
                            <a th:href="@{/inscripciones/eliminar/{id}(id=${inscripcion.id})}"
                               class="btn btn-danger btn-sm fw-semibold shadow-sm px-2"
                               onclick="return confirm('¿Estás seguro de cancelar esta inscripción?');">
                                <i class="bi bi-trash-fill me-1"></i>Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(inscripciones)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No hay inscripciones registradas actualmente.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
