<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Inscripción - Sistema de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left me-1"></i>Regresar al Inicio
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white p-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-journal-plus me-2"></i>
                        <span th:text="${inscripcion.id != null} ? 'Editar Inscripción' : 'Registrar Nueva Inscripción'">Formulario Inscripción</span>
                    </h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/inscripciones/guardar}" th:object="${inscripcion}" method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="cursoId" class="form-label fw-semibold">Seleccionar Curso</label>
                            <select id="cursoId" th:field="*{cursoId}" class="form-select" required>
                                <option value="" disabled selected>-- Seleccione un curso --</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.id}"
                                        th:text="${curso.nombre != null ? curso.nombre : 'Curso #' + curso.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="participanteId" class="form-label fw-semibold">Seleccionar Participante</label>
                            <select id="participanteId" th:field="*{participanteId}" class="form-select" required>
                                <option value="" disabled selected>-- Seleccione un participante --</option>
                                <option th:each="participante : ${participantes}"
                                        th:value="${participante.id}"
                                        th:text="${participante.nombres + ' ' + participante.apellidos}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fechaInscripcion" class="form-label fw-semibold">Fecha de Inscripción</label>
                            <input type="date" id="fechaInscripcion" th:field="*{fechaInscripcion}" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label for="estado" class="form-label fw-semibold">Estado de Inscripción</label>
                            <select id="estado" th:field="*{estado}" class="form-select" required>
                                <option value="ACTIVA">ACTIVA</option>
                                <option value="CANCELADA">CANCELADA</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <a href="/inscripciones" class="btn btn-outline-secondary w-50">
                                <i class="bi bi-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary w-50 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Guardar Inscripción
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
