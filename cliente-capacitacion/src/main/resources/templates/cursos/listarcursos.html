<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos - Sistema de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <a href="/" class="btn btn-outline-secondary btn-sm shadow-sm mb-3">
                <i class="bi bi-arrow-left me-1"></i>Regresar
            </a>
            <h2 class="fw-bold text-dark"><i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Cursos Disponibles</h2>
            <p class="text-muted mb-0">Haz clic en un curso para ver su descripción y opciones de gestión.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a href="/cursos/nuevo" class="btn btn-primary fw-semibold px-4 shadow-sm">
                <i class="bi bi-plus-circle me-1"></i>Nuevo Curso
            </a>
        </div>
    </div>

    <form th:action="@{/cursos}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" class="form-control shadow-sm" name="nombre" th:value="${nombreFiltro}" placeholder="Buscar por nombre">
        </div>
        <div class="col-md-4">
            <select class="form-select shadow-sm" name="modalidad">
                <option value="" th:selected="${modalidadFiltro == null || modalidadFiltro == ''}">Todas las modalidades</option>
                <option value="VIRTUAL" th:selected="${modalidadFiltro == 'VIRTUAL'}">VIRTUAL</option>
                <option value="PRESENCIAL" th:selected="${modalidadFiltro == 'PRESENCIAL'}">PRESENCIAL</option>
            </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary w-100 shadow-sm fw-semibold">
                <i class="bi bi-search me-1"></i>Buscar
            </button>
            <a href="/cursos" class="btn btn-outline-secondary shadow-sm" title="Limpiar filtro">
                <i class="bi bi-arrow-counterclockwise"></i>
            </a>
        </div>
    </form>

    <div th:if="${error}" class="alert alert-danger shadow-sm border-0 rounded-3" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(cursos)}" class="alert alert-info shadow-sm border-0 rounded-3 text-center py-4">
        <i class="bi bi-info-circle-fill fs-4 d-block mb-2"></i>
        <span>No se encontraron cursos que coincidan con la búsqueda.</span>
    </div>

    <div class="accordion shadow-sm rounded-3 overflow-hidden" id="accordionCursos" th:unless="${#lists.isEmpty(cursos)}">
        <div class="accordion-item mb-2 border-0 shadow-sm rounded overflow-hidden" th:each="curso, iterStat : ${cursos}">

            <h2 class="accordion-header" th:id="'heading' + ${iterStat.index}">
                <button class="accordion-button collapsed fw-semibold py-3" type="button" data-bs-toggle="collapse"
                        th:data-bs-target="'#collapse' + ${iterStat.index}" aria-expanded="false"
                        th:aria-controls="'#collapse' + ${iterStat.index}">

                    <div class="container-fluid px-0">
                        <div class="row align-items-center w-100 g-2">
                            <div class="col-3 col-md-2">
                                <span class="badge bg-dark px-2 py-2" th:text="${curso.codigo}">JAVA-101</span>
                            </div>
                            <div class="col-9 col-md-5 text-truncate">
                                <span th:text="${curso.nombre}" class="text-dark">Nombre del Curso</span>
                            </div>
                            <div class="col-6 col-md-3 text-md-center">
                                <span class="badge bg-primary px-3 py-2" th:text="${curso.modalidad}">VIRTUAL</span>
                            </div>
                            <div class="col-6 col-md-2 text-md-center">
                                <span th:if="${curso.activo}" class="badge bg-success px-3 py-2">Activo</span>
                                <span th:unless="${curso.activo}" class="badge bg-secondary px-3 py-2">Inactivo</span>
                            </div>
                        </div>
                    </div>

                </button>
            </h2>

            <div th:id="'collapse' + ${iterStat.index}" class="accordion-collapse collapse"
                 th:aria-labelledby="'heading' + ${iterStat.index}" data-bs-parent="#accordionCursos">
                <div class="accordion-body bg-white border-top">
                    <div class="row align-items-center">

                        <div class="col-md-8">
                            <h6 class="text-secondary fw-bold small text-uppercase">Descripción del Curso:</h6>
                            <p class="text-dark mb-3" th:text="${curso.descripcion != null && !#strings.isEmpty(curso.descripcion) ? curso.descripcion : 'Sin descripción asignada.'}"></p>

                            <div class="p-3 bg-light rounded-3 border d-flex flex-wrap gap-4 text-secondary small">
                                <div>
                                    <span class="d-block text-muted">Cupo Máximo</span>
                                    <strong class="fs-6 text-dark" th:text="${curso.cupo}">25</strong>
                                </div>
                                <div>
                                    <span class="d-block text-muted">Inscritos Activos</span>
                                    <strong class="fs-6 text-primary" th:text="${curso.totalInscritos != null ? curso.totalInscritos : 0}">0</strong>
                                </div>
                                <div>
                                    <span class="d-block text-muted">Cupo Disponible</span>
                                    <strong class="fs-6 text-success" th:text="${curso.cupoDisponible != null ? curso.cupoDisponible : curso.cupo}">25</strong>
                                </div>
                                <div class="ms-md-auto">
                                    <span class="d-block text-muted">Fecha de Inicio</span>
                                    <strong class="fs-6 text-dark" th:text="${curso.fechaInicio}">2026-10-31</strong>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 d-flex justify-content-end gap-2 mt-3 mt-md-0 border-start-md">
                            <a th:href="@{/cursos/editar/{id}(id=${curso.id})}" class="btn btn-warning btn-sm fw-semibold shadow-sm px-3">
                                <i class="bi bi-pencil-square me-1"></i>Editar
                            </a>
                            <a th:href="@{/cursos/eliminar/{id}(id=${curso.id})}" class="btn btn-danger btn-sm fw-semibold shadow-sm px-3"
                               onclick="return confirm('¿Estás seguro de eliminar este curso?');">
                                <i class="bi bi-trash-fill me-1"></i>Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
