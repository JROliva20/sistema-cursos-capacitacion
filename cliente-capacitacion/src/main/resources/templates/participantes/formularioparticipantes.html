<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Participante - Sistema de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left me-1"></i>Regresar al Inicio
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white p-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-fill-add me-2"></i>
                        <span th:text="${participante.id != null} ? 'Editar Participante' : 'Registrar Nuevo Participante'">Formulario Participante</span>
                    </h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/participantes/guardar}" th:object="${participante}" method="post">

                        <!-- Campo ID oculto (Esencial para la edición) -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Actualizado a nombres -->
                        <div class="mb-3">
                            <label for="nombres" class="form-label fw-semibold">Nombres</label>
                            <input type="text" id="nombres" th:field="*{nombres}" class="form-control" placeholder="Ej. Juan Carlos" required>
                        </div>

                        <!-- Actualizado a apellidos -->
                        <div class="mb-3">
                            <label for="apellidos" class="form-label fw-semibold">Apellidos</label>
                            <input type="text" id="apellidos" th:field="*{apellidos}" class="form-control" placeholder="Ej. Pérez Gómez" required>
                        </div>

                        <!-- Actualizado a correo -->
                        <div class="mb-3">
                            <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" id="correo" th:field="*{correo}" class="form-control" placeholder="Ej. juan.perez@email.com" required>
                        </div>

                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control" placeholder="Ej. 5555-4444">
                        </div>

                        <!-- Profesión (Campo requerido por la API) -->
                        <div class="mb-4">
                            <label for="profesion" class="form-label fw-semibold">Profesión u Ocupación</label>
                            <input type="text" id="profesion" th:field="*{profesion}" class="form-control" placeholder="Ej. Desarrollador / Estudiante">
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <a href="/participantes" class="btn btn-outline-secondary w-50">
                                <i class="bi bi-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary w-50 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Guardar Participante
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
