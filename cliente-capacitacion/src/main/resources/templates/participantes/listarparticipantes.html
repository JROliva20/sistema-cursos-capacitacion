<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Participantes - Sistema de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left me-1"></i>Regresar al Inicio
        </a>
    </div>

    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h2 class="fw-bold text-dark"><i class="bi bi-people-fill text-primary me-2"></i>Participantes Registrados</h2>
            <p class="text-muted mb-0">Haz clic en un participante para ver sus datos de contacto y opciones de gestión.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a href="/participantes/nuevo" class="btn btn-primary fw-semibold px-4 shadow-sm">
                <i class="bi bi-person-plus-fill me-1"></i>Nuevo Participante
            </a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger shadow-sm border-0 rounded-3" th:text="${error}"></div>


    <div class="accordion shadow-sm rounded-3 overflow-hidden" id="accordionParticipantes">
        <div class="accordion-item mb-2 border-0 shadow-sm rounded overflow-hidden" th:each="participante, iterStat : ${participantes}">


            <h2 class="accordion-header" th:id="'heading' + ${iterStat.index}">
                <button class="accordion-button collapsed fw-semibold py-3" type="button" data-bs-toggle="collapse"
                        th:data-bs-target="'#collapse' + ${iterStat.index}" aria-expanded="false"
                        th:aria-controls="'#collapse' + ${iterStat.index}">

                    <div class="container-fluid px-0">
                        <div class="row align-items-center w-100 g-2">

                            <div class="col-3 col-md-2">
                                <span class="badge bg-dark px-2 py-2">
                                    <i class="bi bi-person-badge me-1"></i><span th:text="${participante.id}">ID</span>
                                </span>
                            </div>

                            <div class="col-9 col-md-6 text-truncate">
                                <span th:text="${participante.nombres + ' ' + participante.apellidos}" class="text-dark fw-bold">Nombre Completo</span>
                            </div>

                            <div class="col-6 col-md-4 text-md-center text-muted">
                                <i class="bi bi-telephone-fill me-1 text-secondary"></i>
                                <span th:text="${participante.telefono != null ? participante.telefono : 'Sin teléfono'}">Teléfono</span>
                            </div>
                        </div>
                    </div>

                </button>
            </h2>

            <div th:id="'collapse' + ${iterStat.index}" class="accordion-collapse collapse"
                 th:aria-labelledby="'heading' + ${iterStat.index}" data-bs-parent="#accordionParticipantes">
                <div class="accordion-body bg-white border-top">
                    <div class="row align-items-center">

                        <div class="col-md-8">
                            <h6 class="text-secondary fw-bold small text-uppercase">Información de Contacto:</h6>
                            <p class="text-dark mb-2">
                                <i class="bi bi-envelope-fill text-primary me-2"></i>
                                <strong>Correo:</strong> <span th:text="${participante.correo}">correo@ejemplo.com</span>
                            </p>
                            <p class="text-dark mb-0">
                                <i class="bi bi-telephone-fill text-success me-2"></i>
                                <strong>Teléfono:</strong> <span th:text="${participante.telefono != null ? participante.telefono : 'No registrado'}">Teléfono</span>
                            </p>
                        </div>

                        <div class="col-md-4 d-flex justify-content-end gap-2 mt-3 mt-md-0 border-start-md">
                            <a th:href="@{/participantes/editar/{id}(id=${participante.id})}" class="btn btn-warning btn-sm fw-semibold shadow-sm px-3">
                                <i class="bi bi-pencil-square me-1"></i>Editar
                            </a>
                            <a th:href="@{/participantes/eliminar/{id}(id=${participante.id})}" class="btn btn-danger btn-sm fw-semibold shadow-sm px-3"
                               onclick="return confirm('¿Estás seguro de eliminar este participante?');">
                                <i class="bi bi-trash-fill me-1"></i>Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
